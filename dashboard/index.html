<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UVO Vestnik Dashboard</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  background: #f8f9fa;
  color: #1a1a1a;
  line-height: 1.5;
}

.container { max-width: 1400px; margin: 0 auto; padding: 24px; }

header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 16px;
  padding-bottom: 16px;
  border-bottom: 2px solid #e9ecef;
}

header h1 { font-size: 24px; font-weight: 700; color: #1a1a1a; }
header .subtitle { font-size: 14px; color: #6c757d; margin-top: 2px; }
header .meta { font-size: 13px; color: #868e96; text-align: right; }

/* Main navigation tabs */
.main-tabs {
  display: flex;
  gap: 4px;
  margin-bottom: 24px;
  border-bottom: 2px solid #e9ecef;
  padding-bottom: 0;
}

.main-tab {
  padding: 10px 24px;
  border: 1px solid transparent;
  border-bottom: none;
  border-radius: 6px 6px 0 0;
  background: transparent;
  cursor: pointer;
  font-size: 14px;
  font-weight: 600;
  color: #868e96;
  transition: all 0.15s;
  position: relative;
  bottom: -2px;
}

.main-tab:hover { color: #495057; background: #f1f3f5; }
.main-tab.active {
  background: #fff;
  color: #1971c2;
  border-color: #e9ecef;
  border-bottom: 2px solid #fff;
}

.main-content-section { display: none; }
.main-content-section.active { display: block; }

/* Summary cards */
.cards {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 16px;
  margin-bottom: 24px;
}

.card {
  background: #fff;
  border: 1px solid #e9ecef;
  border-radius: 8px;
  padding: 20px;
  text-align: center;
}

.card .label { font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; color: #868e96; margin-bottom: 4px; }
.card .value { font-size: 28px; font-weight: 700; color: #1a1a1a; }
.card .value.green { color: #2b8a3e; }
.card .value.blue { color: #1971c2; }
.card .value.purple { color: #7048e8; }
.card .value.orange { color: #e8590c; }
.card .value.red { color: #e03131; }

/* Year tabs */
.year-tabs {
  display: flex;
  gap: 8px;
  margin-bottom: 16px;
  flex-wrap: wrap;
}

.year-tab {
  padding: 6px 16px;
  border: 1px solid #ced4da;
  border-radius: 6px;
  background: #fff;
  cursor: pointer;
  font-size: 13px;
  font-weight: 500;
  color: #495057;
  transition: all 0.15s;
}

.year-tab:hover { border-color: #4dabf7; color: #1971c2; }
.year-tab.active { background: #1971c2; color: #fff; border-color: #1971c2; }
.year-tab .tab-count { font-size: 11px; color: #868e96; margin-left: 4px; }
.year-tab.active .tab-count { color: rgba(255,255,255,0.7); }

/* Filters */
.filters {
  display: flex;
  gap: 12px;
  margin-bottom: 16px;
  flex-wrap: wrap;
}

.filters input, .filters select {
  font-family: inherit;
  font-size: 14px;
  padding: 8px 12px;
  border: 1px solid #ced4da;
  border-radius: 6px;
  background: #fff;
  color: #1a1a1a;
  outline: none;
}

.filters input:focus, .filters select:focus { border-color: #4dabf7; box-shadow: 0 0 0 2px rgba(77,171,247,0.15); }
.filters input { flex: 1; min-width: 250px; }

/* Table */
.table-wrap {
  background: #fff;
  border: 1px solid #e9ecef;
  border-radius: 8px;
  overflow-x: auto;
  margin-bottom: 32px;
}

table { width: 100%; border-collapse: collapse; font-size: 13px; }

thead th {
  background: #f8f9fa;
  border-bottom: 2px solid #e9ecef;
  padding: 10px 12px;
  text-align: left;
  font-weight: 600;
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 0.3px;
  color: #495057;
  cursor: pointer;
  white-space: nowrap;
  user-select: none;
}

thead th:hover { color: #1a1a1a; }
thead th .sort-arrow { font-size: 10px; margin-left: 4px; color: #adb5bd; }
thead th.sorted .sort-arrow { color: #1971c2; }

tbody tr { border-bottom: 1px solid #f1f3f5; cursor: pointer; }
tbody tr:hover { background: #f8f9fa; }
tbody td { padding: 8px 12px; vertical-align: top; }

td a { color: #1971c2; text-decoration: none; }
td a:hover { text-decoration: underline; }

.badge {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 4px;
  font-size: 11px;
  font-weight: 600;
  white-space: nowrap;
}

.badge-vysledok { background: #d3f9d8; color: #2b8a3e; }
.badge-vyhlasenie { background: #d0ebff; color: #1971c2; }
.badge-zmena_zmluvy { background: #e5dbff; color: #7048e8; }
.badge-oprava { background: #ffe8cc; color: #e8590c; }

.num-col { font-family: "SF Mono", "Menlo", monospace; font-size: 12px; }
.val-col { text-align: right; font-family: "SF Mono", "Menlo", monospace; font-size: 12px; white-space: nowrap; }
.predmet-col { max-width: 320px; }

.no-results { padding: 40px; text-align: center; color: #868e96; }

/* Detail panel */
.detail-overlay {
  display: none;
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.3);
  z-index: 100;
}

.detail-overlay.open { display: block; }

.detail-panel {
  position: fixed;
  top: 0; right: 0; bottom: 0;
  width: 840px;
  max-width: 90vw;
  background: #fff;
  box-shadow: -4px 0 20px rgba(0,0,0,0.15);
  z-index: 101;
  overflow-y: auto;
  padding: 24px;
  transform: translateX(100%);
  transition: transform 0.2s ease;
}

.detail-panel.open { transform: translateX(0); }

.detail-panel .close-btn {
  position: absolute;
  top: 16px; right: 16px;
  background: none;
  border: none;
  font-size: 24px;
  cursor: pointer;
  color: #868e96;
  line-height: 1;
}

.detail-panel .close-btn:hover { color: #1a1a1a; }

.detail-panel h2 { font-size: 18px; margin-bottom: 16px; padding-right: 40px; }

.detail-section {
  margin-bottom: 20px;
  padding-bottom: 16px;
  border-bottom: 1px solid #f1f3f5;
}

.detail-section:last-child { border-bottom: none; }
.detail-section h3 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.5px; color: #868e96; margin-bottom: 8px; }

.detail-row {
  display: flex;
  padding: 4px 0;
  font-size: 13px;
}

.detail-label { color: #868e96; min-width: 140px; flex-shrink: 0; }
.detail-value { color: #1a1a1a; font-weight: 500; word-break: break-word; }

.detail-ucastnik {
  background: #f8f9fa;
  border-radius: 6px;
  padding: 10px 12px;
  margin-bottom: 8px;
  font-size: 13px;
}

.detail-ucastnik-link { cursor: pointer; }
.detail-ucastnik-link:hover { background: #e7f5ff; }

.detail-ucastnik .winner-badge {
  display: inline-block;
  background: #d3f9d8;
  color: #2b8a3e;
  font-size: 10px;
  font-weight: 700;
  padding: 1px 6px;
  border-radius: 3px;
  margin-left: 6px;
}

/* Stats */
.stats {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 24px;
  margin-bottom: 32px;
}

@media (max-width: 768px) { .stats { grid-template-columns: 1fr; } }

.stats-panel {
  background: #fff;
  border: 1px solid #e9ecef;
  border-radius: 8px;
  padding: 20px;
}

.stats-panel h3 { font-size: 14px; font-weight: 600; color: #495057; margin-bottom: 12px; }

.stats-list { list-style: none; }
.stats-list li {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 6px 0;
  border-bottom: 1px solid #f1f3f5;
  font-size: 13px;
}
.stats-list li:last-child { border-bottom: none; }
.stats-list .name { flex: 1; margin-right: 12px; color: #495057; }
.stats-list .count {
  font-family: "SF Mono", "Menlo", monospace;
  font-size: 12px;
  font-weight: 600;
  color: #1a1a1a;
  white-space: nowrap;
}

.bar-bg {
  flex: 0 0 120px;
  height: 6px;
  background: #f1f3f5;
  border-radius: 3px;
  margin-right: 10px;
  overflow: hidden;
}
.bar-fill { height: 100%; border-radius: 3px; background: #4dabf7; }

.loading { text-align: center; padding: 80px 20px; color: #868e96; font-size: 16px; }
.error { text-align: center; padding: 40px; color: #e03131; }

footer { text-align: center; padding: 16px; font-size: 12px; color: #adb5bd; }

/* ── Analyza tab styles ── */
.analyza-section {
  background: #fff;
  border: 1px solid #e9ecef;
  border-radius: 8px;
  padding: 20px;
  margin-bottom: 24px;
}

.analyza-section h3 {
  font-size: 16px;
  font-weight: 600;
  color: #1a1a1a;
  margin-bottom: 16px;
  padding-bottom: 8px;
  border-bottom: 1px solid #f1f3f5;
}

.analyza-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
}

.analyza-table thead th {
  background: #f8f9fa;
  border-bottom: 2px solid #e9ecef;
  padding: 8px 12px;
  text-align: left;
  font-weight: 600;
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 0.3px;
  color: #495057;
  white-space: nowrap;
  cursor: default;
}

.analyza-table tbody td {
  padding: 8px 12px;
  border-bottom: 1px solid #f1f3f5;
  vertical-align: top;
}

.analyza-table tbody tr:last-child td { border-bottom: none; }

.rate-high { color: #e03131; font-weight: 700; }
.rate-medium { color: #e8590c; font-weight: 600; }
.rate-normal { color: #495057; }

.side-by-side {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 24px;
  margin-bottom: 24px;
}

@media (max-width: 900px) { .side-by-side { grid-template-columns: 1fr; } }

.threshold-group { margin-bottom: 16px; }
.threshold-label {
  display: inline-block;
  padding: 2px 10px;
  border-radius: 4px;
  font-size: 12px;
  font-weight: 600;
  background: #fff3bf;
  color: #e67700;
  margin-bottom: 8px;
}

/* ── Graf tab styles ── */
#graph-canvas-container {
  background: #fff;
  border: 1px solid #e9ecef;
  border-radius: 8px;
  overflow: hidden;
  margin-bottom: 24px;
}

#graph-canvas-container svg {
  display: block;
  width: 100%;
  height: 600px;
}

.graph-tooltip {
  position: absolute;
  background: #fff;
  border: 1px solid #e9ecef;
  border-radius: 6px;
  padding: 10px 14px;
  font-size: 13px;
  pointer-events: none;
  box-shadow: 0 2px 8px rgba(0,0,0,0.12);
  z-index: 200;
  display: none;
  max-width: 300px;
}

.graph-tooltip .tt-name { font-weight: 700; margin-bottom: 2px; }
.graph-tooltip .tt-ico { color: #868e96; font-size: 12px; }
.graph-tooltip .tt-value { margin-top: 4px; font-family: "SF Mono","Menlo",monospace; font-size: 12px; }

.graph-legend {
  display: flex;
  gap: 20px;
  padding: 12px 20px;
  font-size: 13px;
  color: #495057;
  border-top: 1px solid #f1f3f5;
  background: #f8f9fa;
}

.graph-legend-item {
  display: flex;
  align-items: center;
  gap: 6px;
}

.graph-legend-dot {
  width: 12px;
  height: 12px;
  border-radius: 50%;
}

.self-dealing-list {
  list-style: none;
}

.self-dealing-list li {
  padding: 8px 12px;
  border-bottom: 1px solid #f1f3f5;
  font-size: 13px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.self-dealing-list li:last-child { border-bottom: none; }

.self-dealing-name { flex: 1; color: #e03131; font-weight: 500; }
.self-dealing-value {
  font-family: "SF Mono","Menlo",monospace;
  font-size: 12px;
  font-weight: 600;
  color: #e03131;
  white-space: nowrap;
}

/* ── Profil tab styles ── */
.profil-search {
  display: flex;
  gap: 12px;
  margin-bottom: 24px;
  flex-wrap: wrap;
  align-items: center;
}

.profil-search input {
  flex: 1;
  min-width: 250px;
  font-family: inherit;
  font-size: 15px;
  padding: 10px 14px;
  border: 2px solid #ced4da;
  border-radius: 8px;
  background: #fff;
  outline: none;
}

.profil-search input:focus { border-color: #4dabf7; box-shadow: 0 0 0 3px rgba(77,171,247,0.15); }

.profil-search select {
  font-family: inherit;
  font-size: 14px;
  padding: 10px 14px;
  border: 2px solid #ced4da;
  border-radius: 8px;
  background: #fff;
  outline: none;
}

.profil-search button {
  padding: 10px 24px;
  background: #1971c2;
  color: #fff;
  border: none;
  border-radius: 8px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
}

.profil-search button:hover { background: #1864ab; }

.profil-report {
  background: #fff;
  border: 1px solid #e9ecef;
  border-radius: 8px;
  padding: 24px;
  margin-bottom: 24px;
}

.profil-report h2 {
  font-size: 20px;
  margin-bottom: 4px;
}

.profil-report .profil-ico {
  font-size: 13px;
  color: #868e96;
  margin-bottom: 20px;
}

.profil-section {
  margin-bottom: 20px;
  padding-bottom: 16px;
  border-bottom: 1px solid #f1f3f5;
}

.profil-section:last-child { border-bottom: none; }

.profil-section h3 {
  font-size: 14px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  color: #495057;
  margin-bottom: 10px;
}

.profil-section .prose {
  font-size: 14px;
  line-height: 1.7;
  color: #1a1a1a;
  margin-bottom: 12px;
}

.profil-mini-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
  margin-top: 8px;
}

.profil-mini-table th {
  background: #f8f9fa;
  padding: 6px 10px;
  text-align: left;
  font-weight: 600;
  font-size: 11px;
  text-transform: uppercase;
  color: #868e96;
  border-bottom: 1px solid #e9ecef;
}

.profil-mini-table td {
  padding: 6px 10px;
  border-bottom: 1px solid #f1f3f5;
}

.profil-mini-table .val-col { text-align: right; font-family: "SF Mono","Menlo",monospace; font-size: 12px; }

.profil-bar-row {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 4px 0;
}

.profil-bar-name { flex: 1; font-size: 13px; color: #495057; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.profil-bar-bg { flex: 0 0 100px; height: 6px; background: #f1f3f5; border-radius: 3px; overflow: hidden; }
.profil-bar-fill { height: 100%; border-radius: 3px; background: #4dabf7; }
.profil-bar-value { font-family: "SF Mono","Menlo",monospace; font-size: 12px; font-weight: 600; color: #1a1a1a; white-space: nowrap; min-width: 70px; text-align: right; }

.profil-flags { list-style: none; }
.profil-flags li {
  padding: 8px 12px;
  margin-bottom: 6px;
  background: #fff5f5;
  border-left: 3px solid #e03131;
  border-radius: 0 6px 6px 0;
  font-size: 13px;
  color: #c92a2a;
  font-weight: 500;
}

.profil-no-flags {
  padding: 12px;
  background: #ebfbee;
  border-radius: 6px;
  color: #2b8a3e;
  font-size: 13px;
}
</style>
</head>
<body>
<div class="container">

<header>
  <div>
    <h1>UVO Vestnik Dashboard</h1>
    <div class="subtitle">Verejne obstaravanie -- prehlad dokumentov</div>
  </div>
  <div class="meta" id="header-meta"></div>
</header>

<!-- Main navigation tabs -->
<div class="main-tabs">
  <div class="main-tab active" data-tab="dokumenty">Dokumenty</div>
  <div class="main-tab" data-tab="analyza">Analyza</div>
  <div class="main-tab" data-tab="graf">Graf</div>
  <div class="main-tab" data-tab="profil">Profil</div>
</div>

<!-- ═══════════════════ DOKUMENTY TAB ═══════════════════ -->
<div class="main-content-section active" id="section-dokumenty">

<div class="cards" id="cards"></div>

<div class="year-tabs" id="year-tabs"></div>

<div class="filters">
  <input type="text" id="search" placeholder="Hladat (cislo, obstaravatel, predmet, vitaz...)">
  <select id="type-filter">
    <option value="">Vsetky typy</option>
    <option value="vysledok">Vysledky</option>
    <option value="vyhlasenie">Vyhlasenia</option>
    <option value="zmena_zmluvy">Zmeny zmluv</option>
    <option value="oprava">Opravy</option>
  </select>
  <select id="source-filter">
    <option value="">Vsetky zdroje</option>
    <option value="UVO">UVO</option>
    <option value="TED">TED</option>
  </select>
</div>

<div class="table-wrap">
  <table>
    <thead>
      <tr>
        <th data-col="num">Cislo <span class="sort-arrow"></span></th>
        <th data-col="action">Typ <span class="sort-arrow"></span></th>
        <th data-col="obstaravatel">Obstaravatel <span class="sort-arrow"></span></th>
        <th data-col="predmet">Predmet zakazky <span class="sort-arrow"></span></th>
        <th data-col="hodnota">Hodnota (EUR) <span class="sort-arrow"></span></th>
        <th data-col="vitaz">Vitaz / Lehota <span class="sort-arrow"></span></th>
        <th data-col="vestnik">Vestnik <span class="sort-arrow"></span></th>
      </tr>
    </thead>
    <tbody id="table-body">
      <tr><td colspan="7" class="loading">Nacitavam data...</td></tr>
    </tbody>
  </table>
</div>

<div class="stats" id="stats"></div>

</div><!-- end section-dokumenty -->

<!-- ═══════════════════ ANALYZA TAB ═══════════════════ -->
<div class="main-content-section" id="section-analyza">
  <div id="analyza-content" class="loading">Nacitavam analyzu...</div>
</div>

<!-- ═══════════════════ GRAF TAB ═══════════════════ -->
<div class="main-content-section" id="section-graf">
  <div id="graf-content" class="loading">Nacitavam graf...</div>
</div>

<!-- ═══════════════════ PROFIL TAB ═══════════════════ -->
<div class="main-content-section" id="section-profil">
  <div class="profil-search">
    <input type="text" id="profil-query" placeholder="Zadajte ICO alebo nazov firmy / obstaravatela...">
    <select id="profil-type">
      <option value="dodavatel">Dodavatel</option>
      <option value="obstaravatel">Obstaravatel</option>
    </select>
    <button id="profil-btn">Vyhladat</button>
  </div>
  <div id="profil-result"></div>
</div>

<footer>UVO Vestnik Dashboard &mdash; data z vestnik-parser.py</footer>

</div>

<!-- Detail slide-out panel -->
<div class="detail-overlay" id="detail-overlay"></div>
<div class="detail-panel" id="detail-panel">
  <button class="close-btn" id="detail-close">&times;</button>
  <div id="detail-content"></div>
</div>

<!-- Graph tooltip -->
<div class="graph-tooltip" id="graph-tooltip">
  <div class="tt-name"></div>
  <div class="tt-ico"></div>
  <div class="tt-value"></div>
</div>

<script>
// ══════════════════════════════════════════════════════════════
// GLOBAL UTILITIES
// ══════════════════════════════════════════════════════════════

function esc(s) {
  if (!s) return '';
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function formatEur(val) {
  if (val == null || val === '') return '';
  const n = Number(val);
  if (isNaN(n)) return '';
  return n.toLocaleString('sk-SK', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' EUR';
}

function formatEurShort(val) {
  const n = Number(val);
  if (isNaN(n) || n === 0) return '0 EUR';
  if (n >= 1e6) return (n / 1e6).toLocaleString('sk-SK', { maximumFractionDigits: 1 }) + ' mil. EUR';
  if (n >= 1e3) return (n / 1e3).toLocaleString('sk-SK', { maximumFractionDigits: 0 }) + ' tis. EUR';
  return n.toLocaleString('sk-SK', { maximumFractionDigits: 0 }) + ' EUR';
}

function formatNum(val) {
  if (val == null) return '-';
  return Number(val).toLocaleString('sk-SK');
}

// ══════════════════════════════════════════════════════════════
// MAIN TAB NAVIGATION
// ══════════════════════════════════════════════════════════════

let analysisLoaded = false;
let graphLoaded = false;

document.querySelectorAll('.main-tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.main-tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.main-content-section').forEach(s => s.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById('section-' + tab.dataset.tab).classList.add('active');

    if (tab.dataset.tab === 'analyza' && !analysisLoaded) {
      loadAnalysis();
    }
    if (tab.dataset.tab === 'graf' && !graphLoaded) {
      loadGraph();
    }
  });
});

let RAW_DATA = [];
let DATA = [];
let sortCol = 'num';
let sortAsc = false;
let activeYear = '';

const ACTION_LABELS = {
  vysledok: 'Vysledok',
  vyhlasenie: 'Vyhlasenie',
  zmena_zmluvy: 'Zmena zmluvy',
  oprava: 'Oprava'
};

function extractYear(vestnik) {
  const m = vestnik.match(/(\d{4})/);
  return m ? m[1] : '';
}

function extractRow(doc) {
  const ext = doc.extraction || {};
  const obst = ext.obstaravatel || {};
  const zak = ext.zakazka || {};
  const vys = ext.vysledok || {};
  const pril = ext.prilezitost || {};
  const zm = ext.zmena_zmluvy || {};

  let hodnota = null;
  let vitaz = '';

  if (doc.action === 'vysledok') {
    hodnota = vys.celkova_hodnota;
    const winners = (vys.ucastnici || []).filter(u => u.je_vitaz);
    vitaz = winners.map(w => w.nazov).join(', ') || '';
  } else if (doc.action === 'vyhlasenie') {
    hodnota = pril.hodnota;
    vitaz = pril.lehota_datum ? ('Lehota: ' + pril.lehota_datum) : '';
  } else if (doc.action === 'zmena_zmluvy') {
    hodnota = zm.hodnota_po_zmene;
    vitaz = zm.dodavatel ? zm.dodavatel.nazov : '';
  }

  return {
    num: doc.num || doc.id || '',
    action: doc.action || '',
    type_label: ACTION_LABELS[doc.action] || doc.action,
    obstaravatel: obst.nazov || '',
    ico: obst.ico || '',
    predmet: zak.predmet || '',
    pocet_casti: zak.pocet_casti || 1,
    hodnota: hodnota,
    vitaz: vitaz,
    vestnik: doc.vestnik || '',
    zdroj: (doc.vestnik || '').startsWith('TED') || (doc.url || '').includes('ted.europa') ? 'TED' : 'UVO',
    year: extractYear(doc.vestnik || ''),
    url: doc.url || '',
    id: doc.id || '',
    _raw: doc
  };
}

function renderYearTabs(rows) {
  const yearCounts = {};
  rows.forEach(r => {
    if (r.year) yearCounts[r.year] = (yearCounts[r.year] || 0) + 1;
  });
  const years = Object.keys(yearCounts).sort();

  const container = document.getElementById('year-tabs');
  container.innerHTML =
    `<div class="year-tab ${activeYear === '' ? 'active' : ''}" data-year="">Vsetky<span class="tab-count">(${rows.length})</span></div>` +
    years.map(y =>
      `<div class="year-tab ${activeYear === y ? 'active' : ''}" data-year="${y}">${y}<span class="tab-count">(${yearCounts[y]})</span></div>`
    ).join('');

  container.querySelectorAll('.year-tab').forEach(tab => {
    tab.addEventListener('click', () => {
      activeYear = tab.dataset.year;
      render();
    });
  });
}

function renderCards(rows) {
  const total = rows.length;
  const counts = { vysledok: 0, vyhlasenie: 0, zmena_zmluvy: 0, oprava: 0 };
  let totalValue = 0;

  rows.forEach(r => {
    counts[r.action] = (counts[r.action] || 0) + 1;
    if (r.hodnota != null && !isNaN(r.hodnota)) totalValue += r.hodnota;
  });

  document.getElementById('cards').innerHTML = `
    <div class="card"><div class="label">Dokumenty celkom</div><div class="value">${total}</div></div>
    <div class="card"><div class="label">Vysledky</div><div class="value green">${counts.vysledok}</div></div>
    <div class="card"><div class="label">Vyhlasenia</div><div class="value blue">${counts.vyhlasenie}</div></div>
    <div class="card"><div class="label">Zmeny zmluv</div><div class="value purple">${counts.zmena_zmluvy}</div></div>
    <div class="card"><div class="label">Opravy</div><div class="value orange">${counts.oprava}</div></div>
    <div class="card"><div class="label">Celkova hodnota</div><div class="value">${formatEurShort(totalValue)}</div></div>
  `;
}

const PAGE_SIZE = 100;
let currentPage = 0;
let currentFilteredRows = [];

function renderTableRow(r, i) {
  return `<tr data-idx="${i}">
      <td class="num-col"><a href="${r.url}" target="_blank" title="Otvorit na UVO">${r.num}</a></td>
      <td><span class="badge badge-${r.action}">${r.type_label}</span></td>
      <td>${esc(r.obstaravatel)}${r.ico ? ' <span style="color:#adb5bd;font-size:11px">(' + r.ico + ')</span>' : ''}</td>
      <td class="predmet-col">${r.pocet_casti > 1 ? '<span style="display:inline-block;padding:1px 5px;border-radius:3px;font-size:10px;font-weight:700;background:#e7f5ff;color:#1971c2;margin-right:4px">' + r.pocet_casti + ' lotov</span>' : ''}${esc(r.predmet)}</td>
      <td class="val-col">${r._cenovy_pomer != null ? `<span style="display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;background:${r._cenovy_pomer > 95 ? '#e03131' : (r._cenovy_pomer > 85 ? '#e8590c' : '#2b8a3e')}" title="Pomer cena/rozpocet: ${r._cenovy_pomer.toFixed(1)}%"></span>` : ''}${r.hodnota != null ? formatEur(r.hodnota) : '<span style="color:#ced4da">-</span>'}</td>
      <td>${esc(r.vitaz)}</td>
      <td style="white-space:nowrap;font-size:12px;color:#868e96"><span style="display:inline-block;padding:1px 5px;border-radius:3px;font-size:10px;font-weight:700;margin-right:4px;${r.zdroj === 'TED' ? 'background:#e7f5ff;color:#1971c2' : 'background:#f1f3f5;color:#868e96'}">${r.zdroj}</span>${esc(r.vestnik)}</td>
    </tr>`;
}

function renderTable(rows) {
  const tbody = document.getElementById('table-body');
  currentFilteredRows = rows;
  currentPage = 0;

  if (rows.length === 0) {
    tbody.innerHTML = '<tr><td colspan="7" class="no-results">Ziadne vysledky</td></tr>';
    return;
  }

  const pageRows = rows.slice(0, PAGE_SIZE);
  tbody.innerHTML = pageRows.map((r, i) => renderTableRow(r, i)).join('');

  // Show more button
  if (rows.length > PAGE_SIZE) {
    tbody.innerHTML += `<tr id="load-more-row"><td colspan="7" style="text-align:center;padding:12px">
      <button id="load-more-btn" style="padding:8px 24px;background:#1971c2;color:#fff;border:none;border-radius:6px;font-size:13px;cursor:pointer">
        Zobrazit dalsich ${Math.min(PAGE_SIZE, rows.length - PAGE_SIZE)} z ${rows.length} dokumentov
      </button></td></tr>`;
    document.getElementById('load-more-btn').addEventListener('click', loadMore);
  }

  attachRowClicks(tbody, rows);
}

function loadMore() {
  currentPage++;
  const start = currentPage * PAGE_SIZE;
  const end = Math.min(start + PAGE_SIZE, currentFilteredRows.length);
  const tbody = document.getElementById('table-body');

  // Remove load-more row
  const lmr = document.getElementById('load-more-row');
  if (lmr) lmr.remove();

  // Append new rows
  const fragment = document.createElement('tbody');
  fragment.innerHTML = currentFilteredRows.slice(start, end).map((r, i) => renderTableRow(r, start + i)).join('');
  while (fragment.firstChild) tbody.appendChild(fragment.firstChild);

  // Add new load-more if needed
  if (end < currentFilteredRows.length) {
    const remaining = currentFilteredRows.length - end;
    const tr = document.createElement('tr');
    tr.id = 'load-more-row';
    tr.innerHTML = `<td colspan="7" style="text-align:center;padding:12px">
      <button id="load-more-btn" style="padding:8px 24px;background:#1971c2;color:#fff;border:none;border-radius:6px;font-size:13px;cursor:pointer">
        Zobrazit dalsich ${Math.min(PAGE_SIZE, remaining)} z ${currentFilteredRows.length} dokumentov
      </button></td>`;
    tbody.appendChild(tr);
    document.getElementById('load-more-btn').addEventListener('click', loadMore);
  }

  attachRowClicks(tbody, currentFilteredRows);
}

function attachRowClicks(tbody, rows) {
  tbody.querySelectorAll('tr[data-idx]').forEach(tr => {
    if (tr._clickBound) return;
    tr._clickBound = true;
    tr.addEventListener('click', (e) => {
      if (e.target.tagName === 'A') return;
      const idx = parseInt(tr.dataset.idx);
      showDetail(rows[idx]);
    });
  });
}

function renderStats(rows) {
  const obstCounts = {};
  rows.forEach(r => {
    if (r.obstaravatel) obstCounts[r.obstaravatel] = (obstCounts[r.obstaravatel] || 0) + 1;
  });
  const topObst = Object.entries(obstCounts).sort((a, b) => b[1] - a[1]).slice(0, 5);
  const maxObstCount = topObst.length > 0 ? topObst[0][1] : 1;

  const vitazValues = {};
  rows.forEach(r => {
    if (r.action === 'vysledok' && r.vitaz && r.hodnota > 0) {
      vitazValues[r.vitaz] = (vitazValues[r.vitaz] || 0) + r.hodnota;
    }
  });
  const topVitaz = Object.entries(vitazValues).sort((a, b) => b[1] - a[1]).slice(0, 5);
  const maxVitazVal = topVitaz.length > 0 ? topVitaz[0][1] : 1;

  document.getElementById('stats').innerHTML = `
    <div class="stats-panel">
      <h3>Top 5 obstaravatelia (podla poctu)</h3>
      <ul class="stats-list">
        ${topObst.map(([name, count]) => `
          <li>
            <span class="name">${esc(name)}</span>
            <div class="bar-bg"><div class="bar-fill" style="width:${(count / maxObstCount * 100).toFixed(0)}%"></div></div>
            <span class="count">${count}</span>
          </li>
        `).join('')}
        ${topObst.length === 0 ? '<li class="no-results">Ziadne data</li>' : ''}
      </ul>
    </div>
    <div class="stats-panel">
      <h3>Top 5 vitazi (podla hodnoty)</h3>
      <ul class="stats-list">
        ${topVitaz.map(([name, val]) => `
          <li>
            <span class="name">${esc(name)}</span>
            <div class="bar-bg"><div class="bar-fill" style="width:${(val / maxVitazVal * 100).toFixed(0)}%;background:#51cf66"></div></div>
            <span class="count">${formatEurShort(val)}</span>
          </li>
        `).join('')}
        ${topVitaz.length === 0 ? '<li class="no-results">Ziadne data</li>' : ''}
      </ul>
    </div>
  `;
}

function showDetail(row) {
  const doc = row._raw;
  const ext = doc.extraction || {};
  const obst = ext.obstaravatel || {};
  const zak = ext.zakazka || {};
  const vys = ext.vysledok || {};
  const pril = ext.prilezitost || {};
  const zm = ext.zmena_zmluvy || {};

  let html = `<h2>${esc(zak.predmet || 'Dokument ' + row.num)}</h2>`;

  html += `<div class="detail-section">
    <h3>Zakladne udaje</h3>
    <div class="detail-row"><span class="detail-label">ID dokumentu</span><span class="detail-value"><a href="${row.url}" target="_blank">${esc(row.num)}</a></span></div>

      <a href="${row.url}" target="_blank" style="display:inline-block;padding:5px 12px;background:#1971c2;color:#fff;border-radius:5px;font-size:12px;font-weight:600;text-decoration:none">Originalny dokument</a>
      ${obst.profil_url ? `<a href="${obst.profil_url}" target="_blank" style="display:inline-block;padding:5px 12px;background:#e9ecef;color:#495057;border-radius:5px;font-size:12px;font-weight:600;text-decoration:none">Profil obstaravatela</a>` : ''}
    </div>
  </div>`;

  html += `<div class="detail-section">
    <h3>Obstaravatel</h3>
    <div class="detail-row"><span class="detail-label">Nazov</span><span class="detail-value">${esc(obst.nazov || '-')}</span></div>
    <div class="detail-row"><span class="detail-label">ICO</span><span class="detail-value">${esc(obst.ico || '-')}</span></div>
    <div class="detail-row"><span class="detail-label">Email</span><span class="detail-value">${esc(obst.email || '-')}</span></div>
  </div>`;

  html += `<div class="detail-section">
    <h3>Zakazka</h3>
    <div class="detail-row"><span class="detail-label">Predmet</span><span class="detail-value">${esc(zak.predmet || '-')}</span></div>
    <div class="detail-row"><span class="detail-label">CPV kod</span><span class="detail-value">${esc(zak.cpv_kod || '-')}</span></div>
    <div class="detail-row"><span class="detail-label">Druh zakazky</span><span class="detail-value">${esc(zak.druh || '-')}</span></div>
  </div>`;

  if (doc.action === 'vysledok' || doc.action === 'suhrn') {
    html += `<div class="detail-section">
      <h3>Vysledok</h3>
      <div class="detail-row"><span class="detail-label">Celkova hodnota</span><span class="detail-value">${vys.celkova_hodnota != null ? formatEur(vys.celkova_hodnota) : '-'}</span></div>
      <div class="detail-row"><span class="detail-label">Pocet ponuk</span><span class="detail-value">${vys.pocet_ponuk != null ? vys.pocet_ponuk : '-'}</span></div>
    </div>`;

    const ucastnici = vys.ucastnici || [];
    if (vys.pocet_ponuk && ucastnici.length < vys.pocet_ponuk) {
      html += `<div style="padding:6px 10px;background:#fff3bf;border-radius:4px;font-size:12px;color:#e67700;margin-bottom:16px">UVO zverejnilo ${ucastnici.length} z ${vys.pocet_ponuk} uchadzacov — porazeni uchadzaci nie su menovaní.</div>`;
    }

    if (ucastnici.length > 0) {
      html += `<div class="detail-section"><h3>Ucastnici (${ucastnici.length})</h3>`;
      ucastnici.forEach(u => {
        const hasIco = u.ico && u.ico.trim();
        html += `<div class="detail-ucastnik${hasIco ? ' detail-ucastnik-link' : ''}" ${hasIco ? `data-ico="${esc(u.ico)}"` : ''}>
          <strong>${esc(u.nazov)}</strong>${u.je_vitaz ? '<span class="winner-badge">VITAZ</span>' : ''}
          ${hasIco ? '<span style="float:right;font-size:11px;color:#1971c2;font-weight:600">Zobrazit profil →</span>' : ''}
          <div style="margin-top:4px;font-size:12px;color:#868e96">
            ${hasIco ? 'ICO: ' + esc(u.ico) + ' | ' : ''}
            ${u.cena != null ? 'Cena: ' + formatEur(u.cena) : ''}
            ${u.poradie ? ' | Poradie: ' + u.poradie : ''}
          </div>
        </div>`;
      });
      html += `</div>`;
    }

    // Zmluvy links
    const zmluvy = vys.zmluvy || [];
    if (zmluvy.length > 0) {
      html += `<div class="detail-section"><h3>Zmluvy (${zmluvy.length})</h3>`;
      zmluvy.forEach(z => {
        html += `<div style="display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid #f1f3f5;font-size:13px">
          <span style="color:#868e96;font-size:12px">${esc(z.datum || '')}</span>
          <a href="${z.url || '#'}" target="_blank" style="flex:1">${esc(z.id || z.url || 'Zmluva')}</a>
        </div>`;
      });
      html += `</div>`;
    }
  }

  if (doc.action === 'vyhlasenie' || (doc.action === 'oprava' && ext.prilezitost)) {
    html += `<div class="detail-section">
      <h3>Prilezitost</h3>
      <div class="detail-row"><span class="detail-label">Hodnota</span><span class="detail-value">${pril.hodnota != null ? formatEur(pril.hodnota) : '-'}</span></div>
      <div class="detail-row"><span class="detail-label">Mena</span><span class="detail-value">${esc(pril.mena || 'EUR')}</span></div>
      <div class="detail-row"><span class="detail-label">Lehota datum</span><span class="detail-value">${esc(pril.lehota_datum || '-')}</span></div>
      <div class="detail-row"><span class="detail-label">Lehota cas</span><span class="detail-value">${esc(pril.lehota_cas || '-')}</span></div>

      ${pril.ramcova_dohoda ? `<div class="detail-row"><span class="detail-label">Ramcova dohoda</span><span class="detail-value">Ano</span></div>` : ''}
      ${pril.kriterium ? `<div class="detail-row"><span class="detail-label">Kriterium</span><span class="detail-value">${esc(pril.kriterium)}</span></div>` : ''}
    </div>`;
  }

  if (doc.action === 'zmena_zmluvy') {
    html += `<div class="detail-section">
      <h3>Zmena zmluvy</h3>
      <div class="detail-row"><span class="detail-label">Dodavatel</span><span class="detail-value">${esc(zm.dodavatel?.nazov || '-')}</span></div>
      <div class="detail-row"><span class="detail-label">Dodavatel ICO</span><span class="detail-value">${esc(zm.dodavatel?.ico || '-')}</span></div>
      <div class="detail-row"><span class="detail-label">Hodnota po zmene</span><span class="detail-value">${zm.hodnota_po_zmene != null ? formatEur(zm.hodnota_po_zmene) : '-'}</span></div>
      ${zm.zmluva_id ? `<div class="detail-row"><span class="detail-label">ID zmluvy</span><span class="detail-value">${esc(zm.zmluva_id)}</span></div>` : ''}
      ${zm.zmluva_datum ? `<div class="detail-row"><span class="detail-label">Datum zmluvy</span><span class="detail-value">${esc(zm.zmluva_datum)}</span></div>` : ''}

      ${zm.odovodnenie ? `<div class="detail-row"><span class="detail-label">Odovodnenie</span><span class="detail-value">${esc(zm.odovodnenie)}</span></div>` : ''}
    </div>`;
  }

  // Related documents & price comparison
  const metaZid = (ext.metadata || {}).id_zakazky;
  if (metaZid && window.ZAKAZKA_INDEX && window.ZAKAZKA_INDEX[metaZid]) {
    const related = window.ZAKAZKA_INDEX[metaZid].filter(rd => rd.id !== doc.id);
    if (related.length > 0) {
      // Find vyhlásenie for budget comparison
      const vyhlasenia = related.filter(rd => rd.action === 'vyhlasenie' || rd.action === 'oprava');
      const vysledky_rel = related.filter(rd => rd.action === 'vysledok');

      // Get budget (predpokladaná hodnota) from vyhlásenie

      }
      if (rozpocet == null && doc.action === 'vysledok') {
        // Current doc is vysledok, no linked vyhlasenie budget
      }
      if (rozpocet == null && doc.action !== 'vysledok') {
        rozpocet = pril.hodnota;

      html += `<div class="detail-section">
        <h3>Porovnanie rozpoctu a vitaznej ceny</h3>`;

      if (rozpocet != null && vitaznaCena != null) {

        const uspora = rozpocet - vitaznaCena;
        const barColor = pomer > 95 ? '#e03131' : (pomer > 85 ? '#e8590c' : '#2b8a3e');
        html += `
          <div style="display:flex;gap:20px;margin-bottom:12px;flex-wrap:wrap">
            <div class="card" style="padding:14px;flex:1;min-width:150px"><div class="label">Rozpocet (predpokladana hodnota)</div><div class="value" style="font-size:18px">${formatEur(rozpocet)}</div></div>
            <div class="card" style="padding:14px;flex:1;min-width:150px"><div class="label">Vitazna cena</div><div class="value" style="font-size:18px">${formatEur(vitaznaCena)}</div></div>
            <div class="card" style="padding:14px;flex:1;min-width:150px"><div class="label">Pomer cena/rozpocet</div><div class="value" style="font-size:18px;color:${barColor}">${pomer.toFixed(1)}%</div></div>
          </div>
          <div style="margin-bottom:8px">
            <div style="background:#f1f3f5;border-radius:4px;height:12px;overflow:hidden">
              <div style="height:100%;width:${Math.min(pomer, 100).toFixed(0)}%;background:${barColor};border-radius:4px;transition:width 0.3s"></div>
            </div>
            <div style="display:flex;justify-content:space-between;font-size:11px;color:#868e96;margin-top:2px">
              <span>0 EUR</span>
              <span>${uspora >= 0 ? 'Uspora: ' + formatEur(uspora) : 'Navysenie: ' + formatEur(-uspora)}</span>
              <span>${formatEurShort(rozpocet)}</span>
            </div>
          </div>`;
      } else if (rozpocet != null) {
        html += `<div class="detail-row"><span class="detail-label">Rozpocet</span><span class="detail-value">${formatEur(rozpocet)}</span></div>
                  <div style="font-size:12px;color:#868e96;margin-top:4px">Vitazna cena nie je k dispozicii.</div>`;
      } else if (vitaznaCena != null) {
        html += `<div class="detail-row"><span class="detail-label">Vitazna cena</span><span class="detail-value">${formatEur(vitaznaCena)}</span></div>
                  <div style="font-size:12px;color:#868e96;margin-top:4px">Rozpocet (predpokladana hodnota) nie je k dispozicii.</div>`;
      }

      // List related documents
      html += `<h3 style="margin-top:16px">Suvisiace dokumenty (zakazka ${esc(metaZid)})</h3>`;
      const allRelated = [doc, ...related].sort((a, b) => (a.id || '').localeCompare(b.id || ''));
      allRelated.forEach(rd => {
        const isCurrent = rd.id === doc.id;
        const rdExt = rd.extraction || {};
        const rdZak = rdExt.zakazka || {};
        const rdLabel = ACTION_LABELS[rd.action] || rd.action;
        html += `<div style="display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid #f1f3f5;${isCurrent ? 'font-weight:600' : ''}">
          <span class="badge badge-${rd.action}" style="flex-shrink:0">${rdLabel}</span>
          <a href="${rd.url || '#'}" target="_blank" style="font-size:12px;font-family:monospace;flex-shrink:0">${esc(rd.id || '')}</a>
          <span style="font-size:13px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(rdZak.predmet || rd.type || '')}</span>
          ${isCurrent ? '<span style="font-size:10px;color:#868e96">(aktuálny)</span>' : ''}
        </div>`;
      });

      html += `</div>`;
    }
  }

  // Lots info
  const casti = ext.casti || [];
  const pocetCasti = zak.pocet_casti || (casti.length > 0 ? casti.length : 1);
  if (pocetCasti > 1 || casti.length > 0) {
    html += `<div class="detail-section">
      <h3>Casti zakazky (${pocetCasti} ${pocetCasti > 4 ? 'casti' : pocetCasti > 1 ? 'casti' : 'cast'})</h3>
      <div class="detail-row"><span class="detail-label">Pocet casti</span><span class="detail-value">${pocetCasti}</span></div>`;
    if (zak.max_casti_ponuka != null) {
      html += `<div class="detail-row"><span class="detail-label">Max. casti na ponuku</span><span class="detail-value">${zak.max_casti_ponuka}</span></div>`;
    }
    if (zak.max_casti_zadanie != null) {
      html += `<div class="detail-row"><span class="detail-label">Max. casti na zadanie</span><span class="detail-value">${zak.max_casti_zadanie}</span></div>`;
    }
    if (zak.max_casti_ponuka != null && zak.max_casti_ponuka < pocetCasti) {
      html += `<div style="margin:8px 0;padding:6px 10px;background:#fff3bf;border-radius:4px;font-size:12px;color:#e67700">Uchadzac moze suťazit len v ${zak.max_casti_ponuka} z ${pocetCasti} casti</div>`;
    } else if (pocetCasti > 1) {
      html += `<div style="margin:8px 0;padding:6px 10px;background:#ebfbee;border-radius:4px;font-size:12px;color:#2b8a3e">Uchadzac moze predlozit ponuku na vsetky casti</div>`;
    }
    if (casti.length > 0) {
      casti.forEach(c => {
        html += `<div style="background:#f8f9fa;border-radius:6px;padding:10px 12px;margin-top:8px;font-size:13px">
          <div style="font-weight:700;margin-bottom:4px">Cast ${c.cislo}${c.lot_id ? ' (' + esc(c.lot_id) + ')' : ''}: ${esc(c.nazov || '')}</div>
          ${c.opis ? '<div style="color:#495057;margin-bottom:4px">' + esc(c.opis.substring(0, 200)) + (c.opis.length > 200 ? '...' : '') + '</div>' : ''}
          <div style="display:flex;gap:16px;color:#868e96;font-size:12px">
            ${c.cpv_kod ? '<span>CPV: ' + esc(c.cpv_kod) + '</span>' : ''}

          </div>
        </div>`;
      });
    }
    html += `</div>`;
  }

  document.getElementById('detail-content').innerHTML = html;
  document.getElementById('detail-overlay').classList.add('open');
  document.getElementById('detail-panel').classList.add('open');
}

function getFiltered() {
  const search = document.getElementById('search').value.toLowerCase().trim();
  const typeFilter = document.getElementById('type-filter').value;
  const sourceFilter = document.getElementById('source-filter').value;
  let rows = DATA;

  if (activeYear) {
    rows = rows.filter(r => r.year === activeYear);
  }
  if (typeFilter) {
    rows = rows.filter(r => r.action === typeFilter);
  }
  if (sourceFilter) {
    rows = rows.filter(r => r.zdroj === sourceFilter);
  }
  if (search) {
    rows = rows.filter(r =>
      r.num.toLowerCase().includes(search) ||
      r.obstaravatel.toLowerCase().includes(search) ||
      r.predmet.toLowerCase().includes(search) ||
      r.vitaz.toLowerCase().includes(search) ||
      r.ico.toLowerCase().includes(search) ||
      r.vestnik.toLowerCase().includes(search)
    );
  }

  rows = [...rows].sort((a, b) => {
    let va = a[sortCol], vb = b[sortCol];
    if (sortCol === 'hodnota') {
      va = va == null ? -Infinity : va;
      vb = vb == null ? -Infinity : vb;
      return sortAsc ? va - vb : vb - va;
    }
    if (sortCol === 'num') {
      const na = parseInt(va) || 0, nb = parseInt(vb) || 0;
      return sortAsc ? na - nb : nb - na;
    }
    va = (va || '').toString().toLowerCase();
    vb = (vb || '').toString().toLowerCase();
    return sortAsc ? va.localeCompare(vb, 'sk') : vb.localeCompare(va, 'sk');
  });

  return rows;
}

function render() {
  const rows = getFiltered();
  renderYearTabs(DATA);
  renderCards(rows);
  renderTable(rows);
  renderStats(rows);

  document.querySelectorAll('thead th').forEach(th => {
    const col = th.dataset.col;
    th.classList.toggle('sorted', col === sortCol);
    const arrow = th.querySelector('.sort-arrow');
    if (col === sortCol) {
      arrow.textContent = sortAsc ? ' \u25B2' : ' \u25BC';
    } else {
      arrow.textContent = '';
    }
  });
}

document.querySelectorAll('thead th').forEach(th => {
  th.addEventListener('click', () => {
    const col = th.dataset.col;
    if (sortCol === col) {
      sortAsc = !sortAsc;
    } else {
      sortCol = col;
      sortAsc = col === 'obstaravatel' || col === 'predmet' || col === 'vitaz';
    }
    render();
  });
});

document.getElementById('search').addEventListener('input', render);
document.getElementById('type-filter').addEventListener('change', render);
document.getElementById('source-filter').addEventListener('change', render);

// Load Dokumenty data
fetch('/api/data')
  .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
  .then(docs => {
    DATA = docs.map(extractRow);
    // Build index: id_zakazky → list of related raw docs
    window.ZAKAZKA_INDEX = {};
    docs.forEach(d => {
      const zid = (d.extraction || {}).metadata?.id_zakazky;
      if (zid) {
        if (!window.ZAKAZKA_INDEX[zid]) window.ZAKAZKA_INDEX[zid] = [];
        window.ZAKAZKA_INDEX[zid].push(d);
      }
    });
    // Pre-compute price ratio for výsledok docs
    DATA.forEach(row => {
      if (row.action !== 'vysledok' || row.hodnota == null) return;
      const zid = (row._raw.extraction || {}).metadata?.id_zakazky;
      if (!zid || !window.ZAKAZKA_INDEX[zid]) return;
      const related = window.ZAKAZKA_INDEX[zid];
      for (const rd of related) {
        if (rd.action === 'vyhlasenie' || rd.action === 'oprava') {
          const rozpocet = (rd.extraction || {}).prilezitost?.hodnota;
          if (rozpocet != null && rozpocet > 0) {
            row._cenovy_pomer = row.hodnota / rozpocet * 100;
            break;
          }
        }
      }
    });
    const vestniks = [...new Set(docs.map(d => d.vestnik).filter(Boolean))].sort();
    const years = [...new Set(DATA.map(r => r.year).filter(Boolean))].sort();
    document.getElementById('header-meta').innerHTML =
      'Roky: ' + years.join(', ') + '<br>Vestniky: ' + vestniks.length + ' | Dokumenty: ' + docs.length;
    render();
  })
  .catch(err => {
    document.getElementById('table-body').innerHTML =
      '<tr><td colspan="7" class="error">Chyba pri nacitani dat: ' + err.message + '</td></tr>';
  });

function renderAnalysis(data) {
  const sb = data.single_bidder || {};
  const sbTotal = sb.celkovo || {};
  const topStats = data.top_stats || {};
  const priceAn = data.price_anomalies || {};
  const topVitazi = topStats.top_vitazi || [];
  const topObst = topStats.top_obstaravatelia || [];
  const yearly = topStats.hodnota_podla_roka || [];

  // Calculate total value from yearly data
  let celkovaHodnota = 0;
  let pocetVitazov = new Set();
  yearly.forEach(y => { celkovaHodnota += (y.celkova_hodnota || 0); });
  topVitazi.forEach(v => { pocetVitazov.add(v.ico); });

  let html = '';

  // Summary cards
  html += `<div class="cards">
    <div class="card"><div class="label">Celkom zakaziek</div><div class="value">${formatNum(sbTotal.total || 0)}</div></div>
    <div class="card"><div class="label">Single-bidder miera</div><div class="value red">${(sbTotal.rate_pct || 0).toLocaleString('sk-SK', {maximumFractionDigits:1})} %</div></div>
    <div class="card"><div class="label">Celkova hodnota</div><div class="value blue">${formatEurShort(celkovaHodnota)}</div></div>
    <div class="card"><div class="label">Pocet vitazov (top)</div><div class="value green">${pocetVitazov.size}</div></div>
  </div>`;

  // Single-bidder section
  const sbObst = sb.top_obstaravatelia || [];
  html += `<div class="analyza-section">
    <h3>Single-bidder obstaravatelia</h3>
    <table class="analyza-table">
      <thead><tr>
        <th>Obstaravatel</th><th>ICO</th><th>Zakazky</th><th>Single-bidder</th><th>Miera %</th>
      </tr></thead>
      <tbody>
        ${sbObst.map(o => {
          let rateClass = 'rate-normal';
          if (o.rate_pct > 70) rateClass = 'rate-high';
          else if (o.rate_pct > 50) rateClass = 'rate-medium';
          return `<tr>
            <td>${esc(o.nazov)}</td>
            <td class="num-col">${esc(o.ico)}</td>
            <td style="text-align:center">${o.total_tenders}</td>
            <td style="text-align:center">${o.single_bidder}</td>
            <td class="${rateClass}" style="text-align:right">${o.rate_pct.toLocaleString('sk-SK', {maximumFractionDigits:1})} %</td>
          </tr>`;
        }).join('')}
      </tbody>
    </table>
  </div>`;

  // Price anomalies
  const thresholds = priceAn.threshold_proximity || [];
  if (thresholds.length > 0) {
    html += `<div class="analyza-section">
      <h3>Cenove anomalie (blizko prahovych hodnot)</h3>`;
    thresholds.forEach(thr => {
      // Deduplicate by doc_id+hodnota
      const seen = new Set();
      const unique = thr.records.filter(r => {
        const key = r.doc_id + '_' + r.hodnota;
        if (seen.has(key)) return false;
        seen.add(key);
        return true;
      });
      html += `<div class="threshold-group">
        <span class="threshold-label">Prah: ${esc(thr.label)} (${thr.count} zaznamov)</span>
        <table class="analyza-table" style="margin-top:8px">
          <thead><tr><th>Vestnik</th><th>Obstaravatel</th><th style="text-align:right">Hodnota</th></tr></thead>
          <tbody>
            ${unique.slice(0, 10).map(r => `<tr>
              <td style="white-space:nowrap;font-size:12px;color:#868e96">${esc(r.vestnik || '-')}</td>
              <td>${esc(r.obstaravatel)}</td>
              <td class="val-col">${formatEur(r.hodnota)}</td>
            </tr>`).join('')}
            ${unique.length > 10 ? `<tr><td colspan="3" style="text-align:center;color:#868e96;font-size:12px">... a dalsich ${unique.length - 10}</td></tr>` : ''}
          </tbody>
        </table>
      </div>`;
    });
    html += `</div>`;
  }

  // Top vitazi and obstaravatelia side by side
  const maxVitazVal = topVitazi.length > 0 ? topVitazi[0].celkova_cena : 1;
  const maxObstVal = topObst.length > 0 ? topObst[0].celkovy_vydavok : 1;

  html += `<div class="side-by-side">
    <div class="analyza-section" style="margin-bottom:0">
      <h3>Top 10 vitazi (podla hodnoty)</h3>
      <ul class="stats-list">
        ${topVitazi.map(v => `<li>
          <span class="name">${esc(v.nazov)}</span>
          <div class="bar-bg"><div class="bar-fill" style="width:${(v.celkova_cena / maxVitazVal * 100).toFixed(0)}%;background:#51cf66"></div></div>
          <span class="count">${formatEurShort(v.celkova_cena)}</span>
        </li>`).join('')}
      </ul>
    </div>
    <div class="analyza-section" style="margin-bottom:0">
      <h3>Top 10 obstaravatelia (podla vydavkov)</h3>
      <ul class="stats-list">
        ${topObst.map(o => `<li>
          <span class="name">${esc(o.nazov)}</span>
          <div class="bar-bg"><div class="bar-fill" style="width:${(o.celkovy_vydavok / maxObstVal * 100).toFixed(0)}%"></div></div>
          <span class="count">${formatEurShort(o.celkovy_vydavok)}</span>
        </li>`).join('')}
      </ul>
    </div>
  </div>`;

  // Yearly breakdown
  html += `<div class="analyza-section">
    <h3>Prehlad podla rokov</h3>
    <table class="analyza-table">
      <thead><tr><th>Rok</th><th style="text-align:center">Zakazky</th><th style="text-align:right">Celkova hodnota</th><th style="text-align:right">Priemerna hodnota</th></tr></thead>
      <tbody>
        ${yearly.map(y => `<tr>
          <td style="font-weight:600">${y.rok}</td>
          <td style="text-align:center">${y.pocet_zakaziek}</td>
          <td class="val-col">${formatEurShort(y.celkova_hodnota)}</td>
          <td class="val-col">${formatEurShort(y.priemerna_hodnota)}</td>
        </tr>`).join('')}
      </tbody>
    </table>
  </div>`;

  document.getElementById('analyza-content').innerHTML = html;
}

function loadGraph() {
  // Load D3.js first, then fetch data
  const script = document.createElement('script');
  script.src = 'https://d3js.org/d3.v7.min.js';
  script.onload = () => {
    fetch('/api/graph')
      .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(data => {
        graphLoaded = true;
        renderGraph(data);
      })
      .catch(err => {
        document.getElementById('graf-content').innerHTML =
          '<div class="error">Chyba pri nacitani grafu: ' + err.message + '</div>';
      });
  };
  script.onerror = () => {
    document.getElementById('graf-content').innerHTML =
      '<div class="error">Nepodarilo sa nacitat D3.js kniznicu</div>';
  };
  document.head.appendChild(script);
}

function renderGraph(data) {
  const bwg = data.buyer_winner_graph || {};
  const cobid = data.cobidding_graph || {};
  const summary = bwg.summary || {};
  const components = bwg.components || {};
  const selfDealing = bwg.self_dealing_risk || [];
  const pagerank = bwg.top_20_pagerank || [];
  const topEdges = bwg.top_20_edges || [];
  const bidRigging = cobid.bid_rigging_signals || [];
  const cobidPairs = cobid.top_20_cobidding_pairs || [];

  let html = '';

  // D3 force graph container
  html += `<div id="graph-canvas-container">
    <div id="d3-graph"></div>
    <div class="graph-legend">
      <div class="graph-legend-item"><div class="graph-legend-dot" style="background:#4dabf7"></div> Obstaravatel</div>
      <div class="graph-legend-item"><div class="graph-legend-dot" style="background:#51cf66"></div> Vitaz</div>
      <div class="graph-legend-item"><div class="graph-legend-dot" style="background:#e03131"></div> Oboje (self-dealing riziko)</div>
    </div>
  </div>`;

  // Key metrics
  html += `<div class="cards" style="margin-bottom:24px">
    <div class="card"><div class="label">Uzly v grafe</div><div class="value">${formatNum(summary.nodes)}</div></div>
    <div class="card"><div class="label">Hrany (vztahy)</div><div class="value blue">${formatNum(summary.edges)}</div></div>
    <div class="card"><div class="label">Komponenty</div><div class="value purple">${formatNum(components.count)}</div></div>
    <div class="card"><div class="label">Self-dealing entity</div><div class="value red">${selfDealing.length}</div></div>
  </div>`;

  // Self-dealing
  if (selfDealing.length > 0) {
    html += `<div class="analyza-section">
      <h3>Self-dealing riziko (kupujuci aj vitaz)</h3>
      <ul class="self-dealing-list">
        ${selfDealing.map(s => `<li>
          <span class="self-dealing-name">${esc(s.name)} <span style="color:#adb5bd;font-size:11px;font-weight:400">(${esc(s.ico)})</span></span>
          <span class="self-dealing-value">${formatEurShort(s.total_value)}</span>
        </li>`).join('')}
      </ul>
    </div>`;
  }

  // Co-bidding signals + top pairs side by side
  html += `<div class="side-by-side">`;

  // Bid rigging signals
  html += `<div class="analyza-section" style="margin-bottom:0">
    <h3>Signaly bid-riggingu (jednostranne vyhry)</h3>
    <table class="analyza-table">
      <thead><tr><th>Vzdy vyhra</th><th>Vzdy prehra</th><th>Spolucne ponuky</th></tr></thead>
      <tbody>
        ${bidRigging.length === 0 ? '<tr><td colspan="3" class="no-results">Ziadne signaly</td></tr>' : ''}
        ${bidRigging.map(s => `<tr>
          <td>${esc(s.consistent_winner_name)} <span style="color:#adb5bd;font-size:11px">(${esc(s.consistent_winner_ico)})</span></td>
          <td>${esc(s.consistent_loser_name)} <span style="color:#adb5bd;font-size:11px">(${esc(s.consistent_loser_ico)})</span></td>
          <td style="text-align:center;font-weight:600">${s.co_bids}</td>
        </tr>`).join('')}
      </tbody>
    </table>
  </div>`;

  // Top co-bidding pairs
  html += `<div class="analyza-section" style="margin-bottom:0">
    <h3>Top spolucne ponuky (co-bidding)</h3>
    <table class="analyza-table">
      <thead><tr><th>Firma A</th><th>Firma B</th><th style="text-align:center">Spolucne</th></tr></thead>
      <tbody>
        ${cobidPairs.slice(0, 10).map(p => `<tr>
          <td>${esc(p.company_a_name)}</td>
          <td>${esc(p.company_b_name)}</td>
          <td style="text-align:center;font-weight:600">${p.co_bids}</td>
        </tr>`).join('')}
      </tbody>
    </table>
  </div>`;

  html += `</div>`;

  // PageRank top 20
  html += `<div class="analyza-section">
    <h3>PageRank Top 20</h3>
    <table class="analyza-table">
      <thead><tr><th>#</th><th>Nazov</th><th>ICO</th><th>Typ</th><th style="text-align:right">Hodnota</th></tr></thead>
      <tbody>
        ${pagerank.map((p, i) => `<tr>
          <td style="font-weight:600;color:#868e96">${i + 1}</td>
          <td>${esc(p.name)}</td>
          <td class="num-col">${esc(p.ico)}</td>
          <td><span class="badge" style="background:${p.type === 'winner' ? '#d3f9d8;color:#2b8a3e' : p.type === 'buyer' ? '#d0ebff;color:#1971c2' : '#ffe3e3;color:#e03131'}">${p.type === 'winner' ? 'Vitaz' : p.type === 'buyer' ? 'Obstaravatel' : 'Oboje'}</span></td>
          <td class="val-col">${formatEurShort(p.total_value)}</td>
        </tr>`).join('')}
      </tbody>
    </table>
  </div>`;

  document.getElementById('graf-content').innerHTML = html;

  // Now build D3 force graph
  buildD3Graph(pagerank, topEdges, selfDealing);
}

function buildD3Graph(pagerank, topEdges, selfDealing) {
  const container = document.getElementById('d3-graph');
  const width = container.parentElement.clientWidth;
  const height = 600;

  // Build nodes from pagerank + edges
  const nodeMap = new Map();
  const selfDealingIcos = new Set(selfDealing.map(s => s.ico));

  // Add pagerank nodes
  pagerank.forEach(p => {
    nodeMap.set(p.ico, {
      id: p.ico,
      name: p.name,
      type: selfDealingIcos.has(p.ico) ? 'both' : p.type,
      value: p.total_value || 0
    });
  });

  // Add edge nodes that might not be in pagerank
  topEdges.forEach(e => {
    if (!nodeMap.has(e.buyer_ico)) {
      nodeMap.set(e.buyer_ico, {
        id: e.buyer_ico,
        name: e.buyer_name,
        type: selfDealingIcos.has(e.buyer_ico) ? 'both' : 'buyer',
        value: e.total_value || 0
      });
    }
    if (!nodeMap.has(e.winner_ico)) {
      nodeMap.set(e.winner_ico, {
        id: e.winner_ico,
        name: e.winner_name,
        type: selfDealingIcos.has(e.winner_ico) ? 'both' : 'winner',
        value: e.total_value || 0
      });
    }
  });

  const nodes = Array.from(nodeMap.values());
  const links = topEdges.map(e => ({
    source: e.buyer_ico,
    target: e.winner_ico,
    contracts: e.contracts,
    value: e.total_value
  }));

  // Color scale
  const colorMap = { buyer: '#4dabf7', winner: '#51cf66', both: '#e03131' };

  // Size scale
  const maxVal = Math.max(...nodes.map(n => n.value), 1);
  const sizeScale = (val) => 5 + Math.sqrt(val / maxVal) * 25;

  const svg = d3.select('#d3-graph')
    .append('svg')
    .attr('width', width)
    .attr('height', height)
    .attr('viewBox', [0, 0, width, height]);

  // Zoom
  const g = svg.append('g');
  svg.call(d3.zoom()
    .scaleExtent([0.2, 5])
    .on('zoom', (event) => { g.attr('transform', event.transform); })
  );

  // Arrow markers
  g.append('defs').append('marker')
    .attr('id', 'arrowhead')
    .attr('viewBox', '0 -5 10 10')
    .attr('refX', 20)
    .attr('refY', 0)
    .attr('markerWidth', 6)
    .attr('markerHeight', 6)
    .attr('orient', 'auto')
    .append('path')
    .attr('d', 'M0,-5L10,0L0,5')
    .attr('fill', '#ced4da');

  const simulation = d3.forceSimulation(nodes)
    .force('link', d3.forceLink(links).id(d => d.id).distance(100))
    .force('charge', d3.forceManyBody().strength(-300))
    .force('center', d3.forceCenter(width / 2, height / 2))
    .force('collision', d3.forceCollide().radius(d => sizeScale(d.value) + 2));

  const link = g.append('g')
    .selectAll('line')
    .data(links)
    .join('line')
    .attr('stroke', '#dee2e6')
    .attr('stroke-width', d => Math.max(1, Math.min(d.contracts, 5)))
    .attr('marker-end', 'url(#arrowhead)');

  const node = g.append('g')
    .selectAll('circle')
    .data(nodes)
    .join('circle')
    .attr('r', d => sizeScale(d.value))
    .attr('fill', d => colorMap[d.type] || '#868e96')
    .attr('stroke', '#fff')
    .attr('stroke-width', 1.5)
    .style('cursor', 'pointer');

  // Labels for larger nodes
  const labels = g.append('g')
    .selectAll('text')
    .data(nodes.filter(n => sizeScale(n.value) > 12))
    .join('text')
    .text(d => d.name.length > 20 ? d.name.substring(0, 18) + '...' : d.name)
    .attr('font-size', 10)
    .attr('fill', '#495057')
    .attr('text-anchor', 'middle')
    .attr('dy', d => sizeScale(d.value) + 14)
    .style('pointer-events', 'none');

  // Tooltip
  const tooltip = document.getElementById('graph-tooltip');

  node.on('mouseover', (event, d) => {
    tooltip.style.display = 'block';
    tooltip.querySelector('.tt-name').textContent = d.name;
    tooltip.querySelector('.tt-ico').textContent = 'ICO: ' + d.id;
    tooltip.querySelector('.tt-value').textContent = formatEurShort(d.value);
  })
  .on('mousemove', (event) => {
    tooltip.style.left = (event.pageX + 12) + 'px';
    tooltip.style.top = (event.pageY - 10) + 'px';
  })
  .on('mouseout', () => {
    tooltip.style.display = 'none';
  });

  // Click to pin/unpin
  node.on('click', (event, d) => {
    if (d.fx != null) {
      d.fx = null;
      d.fy = null;
    } else {
      d.fx = d.x;
      d.fy = d.y;
    }
    simulation.alpha(0.3).restart();
  });

  // Drag
  node.call(d3.drag()
    .on('start', (event, d) => {
      if (!event.active) simulation.alphaTarget(0.3).restart();
      d.fx = d.x;
      d.fy = d.y;
    })
    .on('drag', (event, d) => {
      d.fx = event.x;
      d.fy = event.y;
    })
    .on('end', (event, d) => {
      if (!event.active) simulation.alphaTarget(0);
    })
  );

  simulation.on('tick', () => {
    link
      .attr('x1', d => d.source.x)
      .attr('y1', d => d.source.y)
      .attr('x2', d => d.target.x)
      .attr('y2', d => d.target.y);
    node
      .attr('cx', d => d.x)
      .attr('cy', d => d.y);
    labels
      .attr('x', d => d.x)
      .attr('y', d => d.y);
  });
}

function profilFmtEur(val) {
  if (val == null || isNaN(val)) return '0 EUR';
  return Number(val).toLocaleString('sk-SK', {minimumFractionDigits: 2, maximumFractionDigits: 2}) + ' EUR';
}

function profilFmtEurShort(val) {
  const n = Number(val);
  if (isNaN(n) || n === 0) return '0 EUR';
  if (n >= 1e6) return (n / 1e6).toLocaleString('sk-SK', {maximumFractionDigits: 1}) + ' mil. EUR';
  if (n >= 1e3) return (n / 1e3).toLocaleString('sk-SK', {maximumFractionDigits: 0}) + ' tis. EUR';
  return n.toLocaleString('sk-SK', {maximumFractionDigits: 0}) + ' EUR';
}

document.getElementById('profil-btn').addEventListener('click', loadProfil);
document.getElementById('profil-query').addEventListener('keydown', (e) => { if (e.key === 'Enter') loadProfil(); });

function loadProfil() {
  const q = document.getElementById('profil-query').value.trim();
  const t = document.getElementById('profil-type').value;
  const container = document.getElementById('profil-result');
  if (!q) { container.innerHTML = '<div class="error">Zadajte ICO alebo nazov.</div>'; return; }

  container.innerHTML = '<div class="loading">Hladam...</div>';
  fetch(`/api/profile?type=${t}&q=${encodeURIComponent(q)}`)
    .then(r => r.json())
    .then(data => {
      if (data.error) {
        container.innerHTML = `<div class="error">${esc(data.error)}</div>`;
        return;
      }
      renderProfil(data, container);
    })
    .catch(err => {
      container.innerHTML = `<div class="error">Chyba: ${err.message}</div>`;
    });
}

function renderProfil(data, container) {
  const typLabel = data.typ === 'dodavatel' ? 'DODAVATEL' : 'OBSTARAVATEL';
  let html = `<div class="profil-report">
    <h2>${esc(data.nazov)}</h2>
    <div class="profil-ico">ICO: ${esc(data.ico)} | Typ: ${typLabel}</div>`;

  for (const sekcia of (data.sekcie || [])) {
    html += `<div class="profil-section"><h3>${esc(sekcia.nazov)}</h3>`;

    // Prose text
    if (sekcia.text) {
      html += `<div class="prose">${esc(sekcia.text)}</div>`;
    }

    // Section-specific data rendering
    const sn = sekcia.nazov;

    if ((sn === 'Zákaznícky mix' || sn === 'Dvorní dodávatelia') && Array.isArray(sekcia.data) && sekcia.data.length > 0) {
      const max = sekcia.data[0].zakazky || sekcia.data[0].hodnota || 1;
      html += sekcia.data.map(d => `
        <div class="profil-bar-row">
          <span class="profil-bar-name" title="${esc(d.nazov)}">${esc(d.nazov)} ${d.ico ? '<span style="color:#adb5bd;font-size:11px">(' + esc(d.ico) + ')</span>' : ''}</span>
          <div class="profil-bar-bg"><div class="profil-bar-fill" style="width:${Math.round((d.zakazky || 0) / max * 100)}%"></div></div>
          <span class="profil-bar-value">${d.zakazky || 0}x | ${profilFmtEurShort(d.hodnota)}</span>
        </div>
      `).join('');
      if (sekcia.hhi != null) {
        const hc = sekcia.hhi > 2500 ? '#e03131' : (sekcia.hhi > 1500 ? '#e8590c' : '#2b8a3e');
        html += `<div style="margin-top:8px;font-size:12px;color:${hc};font-weight:600">HHI index: ${sekcia.hhi} (${esc(sekcia.hhi_label)})</div>`;
      }
    }

    if (sn === 'Sektorové zameranie' || sn === 'Štruktúra nákupov') {
      if (Array.isArray(sekcia.data) && sekcia.data.length > 0) {
        html += '<table class="profil-mini-table"><thead><tr><th>CPV</th><th>Pocet</th></tr></thead><tbody>';
        html += sekcia.data.map(d => `<tr><td>${esc(d.cpv)}</td><td>${d.pocet}</td></tr>`).join('');
        html += '</tbody></table>';
      }
    }

    if (sn === 'Súťažné správanie' || sn === 'Konkurenčnosť') {
      const d = sekcia.data;
      if (d && typeof d === 'object' && !Array.isArray(d)) {
        html += '<div style="display:flex;gap:16px;flex-wrap:wrap;margin-top:8px">';
        if (d.win_rate != null) html += `<div class="card" style="padding:12px;min-width:120px"><div class="label">Win rate</div><div class="value" style="font-size:22px">${d.win_rate}%</div></div>`;
        if (d.single_bidder_rate != null) {
          const sc = d.single_bidder_rate > 50 ? 'red' : (d.single_bidder_rate > 30 ? 'orange' : 'green');
          html += `<div class="card" style="padding:12px;min-width:120px"><div class="label">Single-bidder</div><div class="value ${sc}" style="font-size:22px">${d.single_bidder_rate}%</div></div>`;
        }
        if (d.avg_bids != null) html += `<div class="card" style="padding:12px;min-width:120px"><div class="label">Priem. ponuk</div><div class="value" style="font-size:22px">${d.avg_bids}</div></div>`;
        html += '</div>';
      }
    }

    if (sn === 'Časový vývoj' && Array.isArray(sekcia.data) && sekcia.data.length > 0) {
      html += '<table class="profil-mini-table"><thead><tr><th>Rok</th><th>Zakazky</th><th class="val-col">Hodnota</th></tr></thead><tbody>';
      html += sekcia.data.map(d =>
        `<tr><td>${d.rok}</td><td>${d.zakazky || d.dokumenty || 0}</td><td class="val-col">${profilFmtEur(d.hodnota)}</td></tr>`
      ).join('');
      html += '</tbody></table>';
    }

    if (sn === 'Sieťové väzby' && Array.isArray(sekcia.data) && sekcia.data.length > 0) {
      html += '<table class="profil-mini-table"><thead><tr><th>Firma</th><th>ICO</th><th>Spolocne tendre</th></tr></thead><tbody>';
      html += sekcia.data.map(d =>
        `<tr><td>${esc(d.nazov)}</td><td>${esc(d.ico)}</td><td>${d.spolocne_tendre}</td></tr>`
      ).join('');
      html += '</tbody></table>';
    }

    if (sn === 'Zmluvy' && Array.isArray(sekcia.data) && sekcia.data.length > 0) {
      html += '<table class="profil-mini-table"><thead><tr><th>Rok</th><th>Predmet</th><th class="val-col">Hodnota</th></tr></thead><tbody>';
      html += sekcia.data.map(d =>
        `<tr><td>${d.rok || ''}</td><td>${d.url ? '<a href="'+d.url+'" target="_blank">'+esc((d.predmet||'').substring(0,60))+'</a>' : esc((d.predmet||'').substring(0,60))}</td><td class="val-col">${profilFmtEur(d.hodnota)}</td></tr>`
      ).join('');
      html += '</tbody></table>';
    }

    if (sn === 'Dodatky k zmluvám' && Array.isArray(sekcia.data) && sekcia.data.length > 0) {
      html += '<table class="profil-mini-table"><thead><tr><th>Dodavatel</th><th class="val-col">Hodnota</th><th>Dovod</th></tr></thead><tbody>';
      html += sekcia.data.map(d =>
        `<tr><td>${esc(d.dodavatel)}</td><td class="val-col">${profilFmtEur(d.hodnota)}</td><td>${esc((d.dovod||'').substring(0,40))}</td></tr>`
      ).join('');
      html += '</tbody></table>';
    }

    if (sn === 'Rizikové indikátory') {
      if (Array.isArray(sekcia.data) && sekcia.data.length > 0) {
        html += '<ul class="profil-flags">';
        html += sekcia.data.map(f => `<li>${esc(f)}</li>`).join('');
        html += '</ul>';
      } else if (sekcia.text) {
        html += `<div class="profil-no-flags">${esc(sekcia.text)}</div>`;
      }
    }

    html += '</div>'; // end profil-section
  }

  html += '</div>'; // end profil-report
  container.innerHTML = html;
}
</script>
